"hasTintedWindows\":\"Getönte Scheiben\",\"hasTirePressureSensor\":\"Reifendruck-Kontrollsystem\",\"hasTowBar\":\"Anhängerkupplung\",\"hasTrafficSignRecognition\":\"Verkehrszeichenerkennung\",\"hasTrailerCouplingSwiveling\":\"Schwenkbare Anhängerkupplung\",\"hasUsbPort\":\"USB\",\"hasVoiceControl\":\"Sprachsteuerung\",\"hasWinterPackage\":\"Winterpaket\",\"hasWinterTires\":\"Winterreifen\",\"hasWirelessCharging\":\"Kabelloses Laden\",\"hasWoodInterior\":\"Holzverkleidung\",\"hasXenon\":\"Xenonscheinwerfer\",\"has_4wd\":\"Allradantrieb\",\"isVatDeductible\":\"MwSt. ausweisbar\",\"hasHeatPump\":\"Wärmepumpe\"},\"equipmentAndDetails\":\"Technische Daten \u0026 Ausstattung\",\"equipmentDescription\":{\"hasAircondition\":\"Das Fahrzeug verfügt über ein System das zur Kühlung des Fahrzeuginneren beiträgt.\",\"hasAntiSpin\":\"ASR sorgt dafür das die Räder des Fahrzeugs nicht durchdrehen und das Fahrzeug auf losem Untergrund oder bei nasser Fahrbahn stabiler ist.\",\"hasClimateControl\":\"Das Fahrzeug verfügt über ein System, das zur Temperaturregulierung im Fahrzeug dient - ausgefeilter als Aircondition\",\"hasCurveLight\":\"Die vorderen Scheinwerfer des Fahrzeugs drehen sich mit, wenn das Lenkrad gedreht wird. Dies erleichtert bei scharfen Kurven das Sehen der Straße im Dunkeln.\",\"hasDct\":\"DCT (Doppelkupplungsgetriebe) ist ein Getriebe, das die Gänge automatisch wählt und in der Regel Kraftstoff spart. Auch bekannt unter Bezeichnungen wie z. B.: DSG, SMG, MasterShift oder Twist Machine.\",\"hasDistanceControl\":\"Das Fahrzeug verfügt über eine Funktion die automatisch dabei hilft den Abstand zum vorausfahrenden Fahrzeug zu halten.\",\"hasEquipmentVariant\":\"%{car} ist erhältlich in unterschiedlichen Varianten. AutoUncle hat für dieses Auto %{variant} registriert.\",\"hasEsp\":\"ESP ist ein System das dabei hilft Ausscheren in Kurven zu vermeiden und die Fahreigenschaften auf nasser Fahrbahn verbessert.\",\"hasGlassRoof\":\"Glasdach, dass das Fahrzeuginnere heller macht und ein Gefühl von \\\"Offenheit\\\" vermittelt.\",\"hasHeadupDisplay\":\"Bei dem Fahrzeug ist ein Display/Armaturenbrett in die Windschutzscheibe integriert. Auf diese Weise muss man nicht nach unten sehen, um die Geschwindigkeit usw. abzulesen.\",\"hasIntelligentLightSystem\":\"Mercedes's Intelligent Light System or BMW/Audi's Laserlight, is an adaptive headlight system which adapts automatically to the current weather, light and driving conditions. When driving at night, the system provides extra light and thus increases safety.\",\"hasIsofix\":\"Isofix ist ein System, das den Einbau von Kindersitzen in Fahrzeugen erleichtert.\",\"hasLaneWarning\":\"Das Fahrzeug hat eine Warnfunktion, die warnt, wenn man aufgrund eines Fehlers auf die Gegenfahrbahn gerät.\",\"hasMagicBodyControl\":\"Mercedes's Magic Body Control adjusts the car's suspension in relation to the road condition, which is scanned by the car's stereo camera.\",\"hasMagicVisionControl\":\"Mercedes's Magic Vision Control cleans the windscreen without splashes of water, which usually briefly disturb the driver's field of vision.\",\"hasManumatic\":\"Halbautomatisches Getriebe, mit dem Gänge leicht mithilfe einer Taste gewechselt werden können.\",\"hasNightViewAssistant\":\"Night View Assistant uses an infrared camera to clearly show the course of the road in the instrument panel display, thus making night driving safer.\",\"hasNoGuarantee\":\"Das Auto wird nur an eine CVR-Nummer verkauft. Auch als 'Großhandel' bezeichnet. In der Praxis bedeutet dies, dass das Auto ohne die übliche Garantie im dänischen Kaufrecht verkauft wird, da der Käufer ein Unternehmen mit CVR sein muss. Mit anderen Worten, es ist ähnlich wie beim privaten Autokauf, bei dem keine Garantie für das Auto gewährt wird.\",\"hasOrgAlloy\":\"Das Fahrzeug enthält Original-Alufelgen.\",\"hasParking\":\"Einparksensoren bilden ein System das Ihnen hilft wenn Sie das Fahrzeug bei engen Verhältnissen parken.\",\"hasParticleFilter\":\"Ein Filter, der bei Dieselfahrzeugen giftige Partikel entfernt. Dieselfahrzeuge mit Partikelfilter ermöglichen eine Steuerersparnis von EUR 100 im Jahr.\",\"hasPilot\":\"Ein Tempomat hält die Geschwindigkeit des Fahrzeugs automatisch, so dass Sie das Gaspedal nicht betätigen müssen.\",\"hasRemovableTowBar\":\"Das Fahrzeug verfügt über eine Anhängerkupplung, die bei Bedarf entfernt werden kann.\",\"hasServotronic\":\"Servotronic adjusts the amount of steering assistance to the current speed, increasing the driver's comfort by lowering the effort required to steer the vehicle.\",\"hasStopAndGo\":\"Das Fahrzeug verfügt über eine Funktion die den Motor automatisch abstellt, z. B. wenn das Fahrzeug an einer roten Ampel hält. Dies spart Kraftstoff.\",\"hasXenon\":\"Spezielle Frontscheinwerfer, die ein stärkeres Licht erzeugen\",\"has_4wd\":\"Vierradantrieb bedeutet, dass das Fahrzeug an allen vier Rädern einen Antrieb hat und auf losem Untergrund und bei Glätte stabiler ist.\",\"isCamperVersion\":\"Das Fahrzeug ist mit besonderer Camping-Ausstattung ausgerüstet (beispielsweise einer Mini-Küche). Außerdem kann die Karosserie des Fahrzeugs wesentlich verändert sein. Bei Fahrzeugen von vor 2007 war es ein steuertechnischer Vorteil, diese Fahrzeuge als Camper-Modelle auszurüsten. Hierdurch konnte ein großer Teil der Zulassungsgebühr gespart werden. Wird die Camper-Ausstattung vom Fahrzeug entfernt, muss für das Fahrzeug eine neue Gebühr entrichtet werden.\",\"isDemoCar\":\"Fast neues Fahrzeug, das in der Regel beim Verkäufer für Probefahrten verwendet wurde.\",\"isLowered\":\"Tiefergelegt bedeutet, das die Bodenfreiheit des Fahrzeugs geringer als normal ist.\",\"isMot\":\"Das Fahrzeug hat kürzlich erfolgreich eine Hauptuntersuchung bestanden.\",\"isServiceOk\":\"Service OK bedeutet, dass alle Serviceprüfungen des Fahrzeugs eingehalten wurden und es sich um ein Scheckheftgepflegtes Fahrzeug handelt.\"},\"fuelTypes\":{\"benzin\":\"Benzin\",\"biodieselDiesel\":\"Biodiesel/Diesel\",\"cngHy rtrauenswürdigen Marktplatz zu tun haben.\",\"type_one\":\"Geprüfter Marktplatz\",\"type_other\":\"Geprüfte Marktplätze\"}},\"sellerKind\":{\"dealer\":\"Händler\",\"private\":\"Privat\"}},\"valuation-explanation\":{\"checklistItem1\":\"Das dänische Steuerministerium nutzt den Bewertungsdienst von AutoUncle, um die Marktpreise für Fahrzeuge zu berechnen, die für die Steuererhebung verwendet werden.\",\"checklistItem2\":\"2000 professionelle Autohändler in ganz Europa verlassen sich auf unsere Erkenntnisse, um ihre Geschäfte zu führen\",\"checklistItem3\":\"Große Marktplätze in Europa nutzen unseren Service, um Preisbewertungen auf ihren Websites anzuzeigen.\",\"content1\":\"Wir von AutoUncle sind der festen Überzeugung, dass jeder Verbraucher die Möglichkeit haben sollte, beim Kauf eines Gebrauchtwagens ein faires Geschäft zu machen. Deshalb haben wir seit 2010 einen kostenlosen, unabhängigen Kfz-Bewertungsdienst aufgebaut, der Verbrauchern in ganz Europa hilft, Fahrzeuge auf der Grundlage ihres Preises zu suchen und zu vergleichen.\u003c/br\u003e\u003c/br\u003eTäglich scannen oder empfangen unsere Systeme Daten von mehr als 3000 Websites (Marktplätze oder Autohändler) in ganz Europa, was zu mehr als 5 Millionen bewerteten Fahrzeugen führt.\",\"content2\":\"Die Preisbewertung für jedes Fahrzeug wird durch einen statistischen Vergleich des Fahrzeugs und seines Preises mit ähnlichen Fahrzeugen, die derzeit zum Verkauf stehen, berechnet. AutoUncle aktualisiert die Bewertungen regelmäßig, um sicherzustellen, dass die angezeigten Vergleiche so genau und aktuell wie möglich sind und auch Markttrends berücksichtigen.\u003c/br\u003e\u003c/br\u003eUnsere Preisvergleiche berücksichtigen mehr als 100 mögliche Faktoren, zum Beispiel:\",\"content3\":\"Dies ermöglicht uns, den Marktwert zu bestimmen, die Angemessenheit des Preises zu bewerten und ihn in eine der fünf Preisbewertungskategorien von AutoUncle einzuordnen.\u003c/br\u003e\u003c/br\u003eDas Ergebnis finden Sie bei allen Autoinseraten. (visuell)\",\"content4\":\"Der Bewertungsdienst von AutoUncle wird täglich von vielen Fachleuten genutzt\",\"content5\":\"Die Bewertung kann, in Fällen, in denen die Anzahl ähnlicher Fahrzeuge auf dem Markt gering ist, weniger genau sein. Außerdem kann die Preisbewertung ungenau sein, wenn in der Auflistung eine falsche Ausstattungsvariante, ein falsches Baujahr oder Ähnliches angegeben ist. Daher ist es immer eine gute Idee, die Fahrzeugangaben im Angebot direkt mit dem Händler oder Verkäufer des Fahrzeugs zu überprüfen.\",\"headline1\":\"Wer ist AutoUncle?\",\"headline2\":\"Wie kommen wir zu einer Fahrzeugbewertung?\",\"headline3\":\"Ein Dienst, dem viele Fachleute vertrauen\",\"headline4\":\"Kann AutoUncle's Preisbewertung falsch sein?\",\"title\":\"AutoUncle's Bewertung\",\"valuationFactors\":{\"keyFactors\":{\"bodyType\":\"Autotyp\",\"engine\":\"Motor\",\"equipment\":\"Ausstattung\",\"heading\":\"In die Bewertung einbezogene Attribute\",\"km\":\"Km\",\"make\":\"Marke\",\"model\":\"Modell\",\"modelGeneration\":\"Modellgeneration\",\"transmission\":\"Getriebe\",\"trimLevel\":\"Ausstattungslinie\",\"year\":\"Erstzulassung\"},\"nonKeyFactors\":{\"carCondition\":\"Der aktuelle Zustand des Fahrzeugs\",\"carPrepared\":\"Wie das Fahrzeug für den Verkauf aufbereitet wurde\",\"dealerShop\":\"Wie das Autohaus aussieht\",\"heading\":\"Parameter, die AutoUncle's Bewertung nicht beeinflussen\",\"imageLook\":\"Wie das Fahrzeug aussieht\"}}},\"helpful-content\":{\"carSearchInsights\":{\"modelVariant\":{\"faq\":{\"answer1\":\"Die \u003ca href=\\\"{{cheapestVariantSearchLink}}\\\" target=\\\"_blank\\\"\u003e\u003cstrong\u003e{{cheapestVariant}}\u003c/strong\u003e\u003c/a\u003e ist der günstigste Einstiegspunkt mit einem Durchschnittspreis von \u003cstrong\u003e{{cheapestVariantAvgPrice}}\u003c/strong\u003e\",\"answer1Fallback\":\"Die günstigste {{brand}} {{model}} Variante auf dem Markt variiert je nach aktuellen Marktbedingungen.\",\"answer2\":\"Es gibt derzeit
