name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck server and packages
        run: npx tsc
      - name: Typecheck web
        run: npx vue-tsc --noEmit -p apps/web/tsconfig.json
      - name: Test
        run: npm test
      - name: Build web
        run: npm -w @carscope/web run build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carscope:${{ github.sha }} .
